<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2426"><meta name="description" content="Temple Orbit: an original, offline-ready marble-shooter arcade adventure."><title>Temple Orbit · The Marble Guardians</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><a class="brand" href="#" aria-label="Temple Orbit home"><span class="brand-mark">◈</span><span>TEMPLE <b>ORBIT</b><small>THE MARBLE GUARDIANS</small></span></a><div class="header-right"><span class="saved" id="save-status">LOCAL PROGRESS</span><button id="audio" class="icon" aria-label="Toggle sound" title="Toggle sound">♫</button><button id="pause" class="icon" aria-label="Pause game" title="Pause · Escape">Ⅱ</button></div></header>
<main><div class="hud"><div><span class="eyebrow">EXPEDITION <b id="level-number">01 / 06</b></span><h1 id="level-name">The Emerald Gate</h1></div><div class="stats"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>BEST</span><strong id="best">0</strong></div><div><span>LIVES</span><strong id="lives" class="hearts">♥ ♥ ♥</strong></div></div></div>
<div class="board-wrap"><canvas id="board" width="980" height="640" aria-label="Marble shooter game. Aim with mouse or touch; click or release touch to shoot. Space swaps, Escape pauses."></canvas><div class="board-tag"><i></i> <span id="board-state">EMERALD SANCTUARY</span></div><div class="combo" id="combo"></div><div class="effects" id="effects"></div>
<div id="overlay" class="overlay"><section class="panel" id="panel"></section></div></div>
<div class="bottom"><div class="ammo"><span class="orb" id="current"></span><div><span class="eyebrow">IN THE CHAMBER</span><strong>Make your next move</strong></div><span class="next-label">NEXT</span><span class="orb small" id="next"></span><button id="swap" aria-label="Swap current and next marble">⇄ <span>Swap</span><kbd>SPACE</kbd></button></div><div class="progress"><div><span id="progress-label">Clear the marble procession</span><span id="progress-count">0%</span></div><div class="progress-track"><i id="progress-bar"></i></div></div></div>
<footer><span><b>AIM</b> Mouse / touch <em>·</em> <b>FIRE</b> Click / release <em>·</em> <b>SWAP</b> Space / right-click</span><button id="levels">Explore temples ↗</button></footer></main><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script src="src/core.js"></script><script src="src/audio.js"></script><script src="src/game.js"></script></body></html>
