function portal(c,game,time){let p=game.path.at(game.path.length),danger=game.pressure||0,magic=palettes[game.level][2],accent=danger>.5?'#ff745d':magic;glow(c,p.x,p.y,60+danger*20,accent+'38');disk(c,p.x,p.y,31,'#112b35','#c2ac78',3);disk(c,p.x,p.y,25,'#04101c','#648e8b',2);c.save();c.translate(p.x,p.y);c.rotate(time*(.4+danger));for(let i=0;i<8;i++){let a=i*Math.PI/4;rune(c,Math.cos(a)*28,Math.sin(a)*28,3,a,accent);c.beginPath();c.arc(0,0,6+i*2,a+time*.3,a+1.2+time*.3);c.strokeStyle=accent+(i%2?'65':'32');c.lineWidth=2;c.stroke();}c.restore();disk(c,p.x,p.y,6,'#030811');if(danger>.5){c.textAlign='center';c.font='bold 9px system-ui';c.fillStyle='#ffc8a0';c.fillText('DANGER',p.x,p.y+46);}}
function atmosphere(c,game,time,reduced){const accent=palettes[game.level][2];for(let i=0;i<24;i++){let x=(i*137.2+Math.sin(time*.23+i)*12+980)%980,y=(i*53.7+Math.cos(time*.17+i)*8+640)%640;disk(c,x,y,1+Math.sin(time+i)*.35,accent+'55');}if(!reduced){for(let i=0;i<3;i++){let x=(time*5+i*410)%1400-200,y=150+i*180;let fog=c.createRadialGradient(x,y,0,x,y,170);fog.addColorStop(0,accent+'06');fog.addColorStop(1,accent+'00');c.fillStyle=fog;c.fillRect(x-170,y-170,340,340);}}if(game.pressure>.45){c.strokeStyle=`rgba(255,94,65,${(game.pressure-.45)*(.5+.2*Math.sin(time*5))})`;c.lineWidth=6;c.strokeRect(3,3,974,634);}}
window.OrbitArt={background,marble,guardian,portal,atmosphere,colors};
})();

</script><script>
(()=>{'use strict';
const{Game,LEVELS,COLORS,R,D}=OrbitCore,$=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d'),audio=new OrbitAudio();
let save={unlocked:1,best:0,records:{},sound:true},storage=true;
try{let s=JSON.parse(localStorage.getItem('temple-orbit-v1'));if(s&&typeof s==='object'){save.unlocked=Math.max(1,Math.min(6,Number(s.unlocked)||1));save.best=Math.max(0,Number(s.best)||0);save.records=s.records&&typeof s.records==='object'?s.records:{};save.sound=s.sound!==false;}}catch{storage=false;}
let game=new Game(0),mode='menu',lives=3,bank=0,aim={x:490,y:120},angle=-Math.PI/2,particles=[],labels=[],time=0,acc=0,last=0,toastTimer=0,comboTimer=0,touch=null,background=null;
audio.enabled=save.sound;
let renderDt=1/60,kick=0,shake=0,hudClock=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function persist(){try{localStorage.setItem('temple-orbit-v1',JSON.stringify(save));}catch{storage=false;}$('save-status').textContent=storage?'PROGRESS SAVED':'SAVING UNAVAILABLE';}
function toast(text){$('toast').textContent=text;$('toast').classList.add('visible');toastTimer=3;}
function show(html){$('overlay').setAttribute('data-screen',mode);$('panel').innerHTML=html;$('overlay').classList.remove('hidden');$('panel').querySelector('button')?.focus({preventScroll:true});}
function hide(){$('overlay').classList.add('hidden');}
function menu(){mode='menu';show(`<div class="sigil">◈</div><span class="kicker">THE MARBLE GUARDIANS</span><h2>Temple<span class="title-orbit">Orbit</span></h2><p>An ancient power is waking. Match three, ignite a chain reaction, and hold back the eclipse.</p><button class="primary" data-action="new">Begin expedition →</button><button class="secondary" data-action="levels">Temples</button><p class="hint">6 temples · 4 relic powers · One stone guardian</p>`);}
function levelMenu(){if(mode==='playing')mode='paused';show(`<span class="kicker">CHOOSE YOUR EXPEDITION</span><h2>The six temples</h2><div class="level-grid">${LEVELS.map((l,i)=>`<button class="level-card" data-level="${i}" ${i>=save.unlocked?'disabled':''}><small>${i>=save.unlocked?'LOCKED':String(i+1).padStart(2,'0')+' / '+(save.records[i]?'BEST '+save.records[i].toLocaleString():'UNDISCOVERED')}</small><strong>${l.name}</strong></button>`).join('')}</div><button class="secondary" data-action="${mode==='paused'?'resume':'home'}">Back</button>`);}
function start(level,fresh=true){if(fresh){lives=3;bank=0;}game=new Game(level);mode='playing';particles=[];labels=[];comboTimer=0;acc=0;background=null;aim={x:490,y:120};hide();audio.start();updateHUD();toast(LEVELS[level].subtitle);}
function pause(){if(mode==='playing'){mode='paused';show(`<span class="kicker">TAKE A BREATH</span><h2>The temple can wait.</h2><p>Your procession is paused.</p><button class="primary" data-action="resume">Resume →</button><button class="secondary" data-action="restart">Restart</button><p class="hint"><button data-action="levels" class="secondary">Choose temple</button></p>`);}else if(mode==='paused'){mode='playing';hide();}}
function finish(won){mode=won?'won':'lost';let total=bank+game.score;if(won){save.unlocked=Math.max(save.unlocked,Math.min(6,game.level+2));save.records[game.level]=Math.max(save.records[game.level]||0,game.score);bank=total;}else lives--;save.best=Math.max(save.best,total);persist();updateHUD();let final=game.level===5;show(`<div class="sigil">${won?'✧':'◈'}</div><span class="kicker">${won?'TEMPLE RESTORED':lives?'THE GUARDIAN STUMBLES':'EXPEDITION ENDED'}</span><h2>${won?(final?'Keeper of the eclipse.':'A brilliant return.'):(lives?'Rise again.':'The eclipse falls.')}</h2><p>${won?(final?'All six temples are safe. Return for a higher score.':'The next sanctuary is waiting for its guardian.'):(lives?`${lives} ${lives===1?'life remains':'lives remain'}. Your temple score resets when you retry.`:'A new expedition begins with three lives.')}</p><div class="result-stats"><div><strong>${total.toLocaleString()}</strong><span>SCORE</span></div><div><strong>×${Math.max(1,game.maxCombo)}</strong><span>BEST CHAIN</span></div></div><button class="primary" data-action="${won&&!final?'next':won?'new':lives?'retry':'new'}">${won&&!final?'Next temple →':won?'Play again →':lives?'Try again →':'New expedition →'}</button><button class="secondary" data-action="levels">Temples</button>`);}
$('panel').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;audio.start();audio.effect('menu');if(b.dataset.level!==undefined){start(Number(b.dataset.level));return;}switch(b.dataset.action){case'new':start(0);break;case'next':start(game.level+1,false);break;case'retry':start(game.level,false);break;case'restart':start(game.level);break;case'resume':mode='playing';hide();break;case'levels':levelMenu();break;case'home':menu();}});
$('pause').onclick=pause;$('pause-touch').onclick=pause;$('levels').onclick=levelMenu;$('swap').onclick=()=>{audio.start();if(mode==='playing')game.swap();};$('audio').onclick=()=>{audio.start();audio.enabled=!audio.enabled;save.sound=audio.enabled;persist();$('audio').textContent=audio.enabled?'♫':'♪̸';$('audio').setAttribute('aria-pressed',String(audio.enabled));toast(audio.enabled?'Sound on':'Sound off');};document.querySelector('.brand').onclick=e=>{e.preventDefault();if(mode==='playing')pause();else menu();};
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*980,y:(e.clientY-r.top)/r.height*640};}
canvas.addEventListener('pointermove',e=>{aim=point(e);});canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;audio.start();aim=point(e);if(e.button===2){game.swap();return;}if(e.pointerType==='touch'||e.pointerType==='pen'){touch=e.pointerId;canvas.setPointerCapture(e.pointerId);}else if(e.button===0)game.shoot(aim.x,aim.y);});canvas.addEventListener('pointerup',e=>{if(e.pointerId===touch){aim=point(e);if(mode==='playing')game.shoot(aim.x,aim.y);touch=null;}});canvas.addEventListener('pointercancel',()=>touch=null);canvas.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('keydown',e=>{if(e.code==='Space'&&mode==='playing'){e.preventDefault();if(!e.repeat)game.swap();}if(e.code==='Escape'&&!e.repeat)pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='playing')pause();});window.addEventListener('blur',()=>{if(mode==='playing')pause();});
function updateHUD(){let total=bank+(game.state==='won'?0:game.score);$('score').textContent=total.toLocaleString();$('best').textContent=Math.max(save.best,total).toLocaleString();$('lives').textContent='♥ '.repeat(Math.max(0,lives)).trim()||'—';$('level-number').textContent=String(game.level+1).padStart(2,'0')+' / 06';$('level-name').textContent=game.cfg.name;$('current').style.backgroundColor=COLORS[game.current];$('next').style.backgroundColor=COLORS[game.next];let pc=Math.min(100,Math.round(game.cleared/(game.cfg.count+game.fired)*100));if(game.state==='won')pc=100;$('progress-bar').style.width=pc+'%';$('progress-count').textContent=pc+'%';$('board-state').textContent=game.cfg.name.toUpperCase();$('effects').innerHTML=Object.entries(game.effects).filter(([,v])=>v>0).map(([k,v])=>`<span>${{slow:'◷ SLOW',reverse:'↶ REVERSE',aim:'⌖ PRECISION'}[k]} ${Math.ceil(v)}s</span>`).join('');$('combo').textContent=comboTimer>0&&game.combo>1?'CHAIN REACTION ×'+game.combo:'';$('pace-value').textContent=(game.speedMultiplier/1.65).toFixed(2)+'×';$('pace-fill').style.width=((game.speedMultiplier-1.65)/.75*100)+'%';$('pace').setAttribute('data-danger',game.pressure>.5?'true':'false');$('pause').setAttribute('aria-label',mode==='paused'?'Resume game':'Pause game');}
function circle(c,x,y,r,fill,stroke,width=1){c.beginPath();c.arc(x,y,r,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.lineWidth=width;c.strokeStyle=stroke;c.stroke();}}
function makeBackground(){return OrbitArt.background(game);}
function marble(x,y,color,r=R,power=null,rotation=0){OrbitArt.marble(ctx,x,y,color,r,power,rotation);}
function guardian(){let[x,y]=game.cfg.shooter;let target=Math.atan2(aim.y-y,aim.x-x);angle+=Math.atan2(Math.sin(target-angle),Math.cos(target-angle))*(1-Math.exp(-26*renderDt));OrbitArt.guardian(ctx,game,angle,reduced?0:time,kick);}
function draw(){if(!background)background=makeBackground();ctx.clearRect(0,0,980,640);ctx.save();if(!reduced&&shake>.05)ctx.translate(Math.sin(time*89)*shake,Math.cos(time*107)*shake*.6);ctx.drawImage(background,0,0);OrbitArt.portal(ctx,game,reduced?0:time);
if(mode==='playing'){let[sx,sy]=game.cfg.shooter,dx=aim.x-sx,dy=aim.y-sy,n=Math.hypot(dx,dy)||1,range=game.effects.aim>0?950:85;ctx.save();ctx.setLineDash([3,9]);ctx.lineWidth=game.effects.aim>0?2:1;ctx.strokeStyle=game.effects.aim>0?'#f7dfa8aa':'#e5dec253';ctx.beginPath();ctx.moveTo(sx+dx/n*48,sy+dy/n*48);ctx.lineTo(sx+dx/n*range,sy+dy/n*range);ctx.stroke();ctx.restore();}
const visible=game.chain.filter(m=>m.s>=0);for(let m of visible){if(m.drawS===undefined)m.drawS=m.s;if(mode==='playing')m.drawS+=(m.s-m.drawS)*(1-Math.exp(-48*renderDt));}const positions=visible.map(m=>game.path.at(m.drawS));for(let i=0;i<visible.length;i++){let m=visible[i],p=positions[i],radius=R;for(let j of[i-1,i+1])if(positions[j])radius=Math.min(radius,Math.max(0,(Math.hypot(p.x-positions[j].x,p.y-positions[j].y)-1)*.5));if(radius<.5)continue;circle(ctx,p.x+2,p.y+4,radius,'#00000030');marble(p.x,p.y,m.color,radius,m.power,m.power?0:m.s*.008);}for(let s of game.shots){ctx.strokeStyle=COLORS[s.color]+'66';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(s.x-s.vx*.024,s.y-s.vy*.024);ctx.lineTo(s.x,s.y);ctx.stroke();marble(s.x,s.y,s.color);}guardian();
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);if(p.ring)circle(ctx,p.x,p.y,p.size,null,OrbitArt.colors[p.color],2);else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*6);ctx.fillStyle=OrbitArt.colors[p.color];ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();}}ctx.globalAlpha=1;ctx.textAlign='center';for(let l of labels){ctx.globalAlpha=Math.min(1,l.life);ctx.fillStyle='#ffe6a3';ctx.font=l.depth>1?'bold 24px Georgia':'18px Georgia';ctx.shadowColor='#071e1e';ctx.shadowBlur=6;ctx.fillText(l.text,l.x,l.y);ctx.shadowBlur=0;}ctx.globalAlpha=1;
OrbitArt.atmosphere(ctx,game,reduced?0:time,reduced);ctx.restore();}

function events(){for(let e of game.events.splice(0)){audio.effect(e.type,e.depth);if(e.type==='shoot'){kick=1;let [x,y]=game.cfg.shooter;let a=Math.atan2(aim.y-y,aim.x-x);for(let i=0;i<(reduced?0:7);i++)particles.push({x:x+Math.cos(a)*43,y:y+Math.sin(a)*43,vx:Math.cos(a+(Math.random()-.5)*.5)*(60+Math.random()*80),vy:Math.sin(a+(Math.random()-.5)*.5)*100,life:.22,max:.22,size:2+Math.random()*2,color:game.current});}if(e.type==='insert')particles.push({x:e.x,y:e.y,vx:0,vy:0,life:.18,max:.18,size:10,color:2,ring:true});if(e.type==='burst'){for(let i=0;i<(reduced?3:18);i++){let a=Math.random()*Math.PI*2,v=65+Math.random()*170;particles.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6,max:.6,size:2+Math.random()*3,color:e.color});}particles.push({x:e.x,y:e.y,vx:0,vy:0,life:.4,max:.4,size:16,color:e.color,ring:true});}if(e.type==='match'){shake=reduced?0:Math.min(3,.5+e.depth*.65);$('score').classList.remove('score-pop');$('score').classList.add('score-pop');if(bank+game.score>save.best){save.best=bank+game.score;persist();}comboTimer=2.5;labels.push({x:e.x,y:e.y-20,text:'+'+e.points+(e.bonus?'  SKILL SHOT':''),life:1.3,depth:e.depth});}if(e.type==='power')toast({slow:'Time relic · slow motion',reverse:'Reversal relic · the tide turns',aim:'Precision relic · guide activated'}[e.power]);if(e.type==='won'){for(let i=0;i<(reduced?0:80);i++)particles.push({x:150+Math.random()*680,y:200,vx:(Math.random()-.5)*180,vy:-100-Math.random()*140,life:2,max:2,size:3+Math.random()*4,color:i%6});finish(true);}if(e.type==='lost')finish(false);}}
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;renderDt=dt||1/60;time+=dt;kick*=Math.exp(-18*dt);shake*=Math.exp(-8*dt);if(mode==='playing'){acc+=dt;while(acc>=1/120){game.step(1/120);events();acc-=1/120;if(mode!=='playing'){acc=0;break;}}audio.update(dt,true);}else acc=0;for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;if(p.ring)p.size+=90*dt;}particles=particles.filter(p=>p.life>0).slice(-450);for(let l of labels){l.life-=dt;l.y-=25*dt;}labels=labels.filter(l=>l.life>0);comboTimer-=dt;toastTimer-=dt;if(toastTimer<=0)$('toast').classList.remove('visible');hudClock-=dt;if(hudClock<=0){updateHUD();hudClock=.08;}draw();requestAnimationFrame(frame);}
$('audio').textContent=audio.enabled?'♫':'♪̸';$('audio').setAttribute('aria-pressed',String(audio.enabled));if(!storage)$('save-status').textContent='SAVING UNAVAILABLE';menu();requestAnimationFrame(frame);
// Explicit opt-in diagnostics only; never needed by gameplay.
if(new URLSearchParams(location.search).has('test'))window.orbitDebug={get game(){return game;},get mode(){return mode;},start,pause,get save(){return save;},finish};
})();

</script></body></html>
